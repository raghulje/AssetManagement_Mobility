# Biogas_MIS style app + MySQL for easy dump/import.
#
# Prereq (once):
#   docker network create proxy
#   cp server/.env.example server/.env   # set PORT, domain, MYSQL_*/DB_*
#   cd client && npm ci && npm run build
#
# Export local DB → import into this MySQL (from host):
#   .\server\scripts\db-export.ps1 -OutFile .\itam-dump.sql
#   .\server\scripts\db-import.ps1 -InFile .\itam-dump.sql
#
# Change `expose` to match PORT in server/.env.
services:
  db:
    image: mysql:8.0
    container_name: itam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-itam_root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-ITAssetManagement_2026}
      MYSQL_USER: ${DB_USER:-itam}
      MYSQL_PASSWORD: ${DB_PASSWORD:-itam_change_me}
    ports:
      # Host port for mysqldump / Workbench / local Node (avoid clash with host MySQL → use 3307)
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    volumes:
      - itam_mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-itam_root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - proxy

  itam:
    image: node:20
    container_name: itam-2026
    working_dir: /app/server
    volumes:
      - ./server:/app/server
      - ./client:/app/client
    command: npm start
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      SERVE_CLIENT: "true"
      # Inside compose, talk to the MySQL service by name
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ITAssetManagement_2026}
      DB_USER: ${DB_USER:-itam}
      DB_PASSWORD: ${DB_PASSWORD:-itam_change_me}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy

volumes:
  itam_mysql_data:

networks:
  proxy:
    external: true
